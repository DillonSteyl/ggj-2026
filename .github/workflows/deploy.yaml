name: "🚀 Deploy"
env:
  godot_version: 4.6-stable
  itch_username: dillonsteyl
  itch_game_id: ggj-2026
on:
  workflow_dispatch:
  push:
    tags:
      - "*"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Export
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: install addons
        run: dotnet tool install --global Chickensoft.GodotEnv && godotenv addons install
      - name: export game
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          # Defining all the required inputs
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.godot_version }}/Godot_v${{ env.godot_version }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.godot_version }}/Godot_v${{ env.godot_version }}_export_templates.tpz
          relative_project_path: ./
          archive_output: true
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: ${{ steps.export.outputs.build_directory }}

  deploy_itch:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ["web"]
        channel: ["html"]
    steps:
      - name: download build files
        uses: actions/download-artifact@v4
        with:
          name: exports
          path: builds
      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
      - name: Upload to itch.io
        run: butler push builds/${{ matrix.template }} ${{ env.itch_username }}/${{ env.itch_game_id }}:${{ matrix.channel }}
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}

      # - uses: KikimoraGames/itch-publish@v0.0.3
      #   with:
      #     butlerApiKey: ${{ secrets.ITCHIO_API_KEY }}
      #     gameData: ./builds/${{ matrix.template }}
      #     itchUsername: ${{ env.itch_username }}
      #     itchGameId: ${{ env.itch_game_id }}
      #     buildChannel: ${{ matrix.channel }}
      #     # buildNumber: ${{ needs.version.outputs.version_hash }}
